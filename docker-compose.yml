version: "3.8"
services:
  
  redis:
    container_name: redis
    image: redis
    volumes:
      - redis-data:/data:rw
    entrypoint: redis-server --appendonly yes
    restart: always
    networks:
      - stream-net

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.local
      target: local_celery

    env_file: 
      - .env
    restart: always
    volumes:
      - .:/app/dev
      - video-temp-data:/storage/video_tmp:rw
      - video-uploads:/storage/uploads:rw
      - streaming-data:/storage/streaming:rw
    depends_on:
      - redis
    networks:
      - stream-net

  api-server:
    build:
      context: .
      dockerfile: Dockerfile.local
      target: local_server

    env_file: 
      - .env
    restart: always
    volumes:
      - .:/app/dev
      - video-temp-data:/storage/video_tmp:rw
      - video-uploads:/storage/uploads:rw
      - streaming-data:/storage/streaming:rw
    depends_on:
      - redis
      - scheduler
    networks:
      - stream-net


  nginx: 
    image: nginx:latest
    volumes:
      - ./streamserver.net.nginx.conf:/etc/nginx/conf.d/dev.streamserver.net.conf:ro
      - ./cert:/etc/nginx/cert
      - streaming-data:/storage/streaming:ro
    ports:
      - 80:80
      - 443:443
    restart: always
    networks:
      - stream-net
    depends_on:
      - redis
      - scheduler
      - api-server
    
volumes:
  redis-data:
      driver: local
  video-temp-data:
      driver: local
  streaming-data:
      driver: local
  video-uploads:
      driver: local


networks:
  stream-net:
