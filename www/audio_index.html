<html ng-app='uploaderApp'>
<head>
	<script type="text/javascript" src="assets/angular.min.js"></script>
	<script src="assets/ng-flow-standalone.min.js"></script>
	<script type="text/javascript">

		var app = angular.module('uploaderApp', ['flow']);
		app.controller('mainCtrl',function($scope, $http, $rootScope){

		})


	</script>
</head>
<body ng-controller="mainCtrl">
	<div 
	flow-init="{target: '/api/audio_upload', 'testChunks': false,
    'maxChunkRetries':5, 'simultaneousUploads':1, 'query':{'attached_to':$parent.ticket_id}}"
	flow-init1="{target: '/api/upload'}"
     flow-files-submitted="$flow.upload()"
     flow-file-success="$file.msg = $message">

  <input type="file" flow-btn/>
  Input OR Other element as upload button
  <span class="btn" flow-btn>Upload File</span>

  <table>
    <tr ng-repeat="file in $flow.files">
        <td>{{$index+1}}</td>
        <td>{{file.name}}</td>
        <td>{{file.msg}}</td>
    </tr>
  </table>
</div>

</body>

</html>
